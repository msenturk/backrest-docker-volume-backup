services:
  backrest:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: backrest-test
    ports:
      - "9898:9898"
    volumes:
      - ./test-data:/data:Z
      - ./test-config:/config:Z
      - ./test-backups:/home/backups:Z
      # Updated for Podman user socket (common on many Linux distros)
      # If this path is different on your system, you can adjust it.
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      # Also mount the volume storage so discovery path validation passes
      - /home/ms/.local/share/containers/storage/volumes:/home/ms/.local/share/containers/storage/volumes:ro,Z
      - /mnt/d/CLM/frontend:/mnt/d/CLM/frontend:ro,Z
    environment:
      - BACKREST_CONFIG=/config/config.json
      - BACKREST_DATA_DIR=/data

  # Test database for discovery
  test-db:
    image: postgres:15-alpine
    container_name: backrest-test-db
    environment:
      - POSTGRES_PASSWORD=example
    volumes:
      - test-db-data:/var/lib/postgresql/data

  # MySQL demo service
  test-mysql:
    image: mysql:8.0
    container_name: backrest-test-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=example
      - MYSQL_DATABASE=demo
    volumes:
      - test-mysql-data:/var/lib/mysql

  # Redis demo service
  test-redis:
    image: redis:7-alpine
    container_name: backrest-test-redis
    volumes:
      - test-redis-data:/data

volumes:
  test-db-data:
  test-mysql-data:
  test-redis-data:
